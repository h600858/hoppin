name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Flutter (analyze og test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed apps packages
      - run: flutter analyze
      - name: Test domain
        working-directory: packages/domain
        run: dart test
      - name: Test data
        working-directory: packages/data
        run: flutter test
      - name: Test ui
        working-directory: packages/ui
        run: flutter test
      - name: Test mobile
        working-directory: apps/mobile
        run: flutter test
      - name: Test admin_web
        working-directory: apps/admin_web
        run: flutter test

  functions:
    name: Functions (lint, test og bygg)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rules:
    name: Firestore-regler (emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run test:emulator:ci
