  <header style="background: #4CAE7D; padding: 18px 16px 16px; display: flex; align-items: center; gap: 8px">

    <section style="background: #FFFFFF; border: 1px solid #E3EAE6; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 700; color: #2D7D5A; letter-spacing: 0.6px; text-transform: uppercase">Når</h2>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1; height: 48px; border-radius: 12px; border: 0; background: #16271F; color: #FFFFFF; font-size: 15px; font-weight: 700">I morgen</button>

      <div style="display: flex; gap: 8px">

      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #EEF3F0">
        <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #2D7D5A">
        <span style="font-size: 15px; font-weight: 700; width: 56px">08:30</span>
        <span style="font-size: 15px; flex-grow: 1">5B · Matematikk</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #EEF3F0">
        <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #2D7D5A">
        <span style="font-size: 15px; font-weight: 700; width: 56px">09:15</span>
        <span style="font-size: 15px; flex-grow: 1">5B · Norsk</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px">
        <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #2D7D5A">
        <span style="font-size: 15px; font-weight: 700; width: 56px">12:15</span>
        <span style="font-size: 15px; flex-grow: 1">6A · Engelsk</span>

    <section style="background: #FFFFFF; border: 1px solid #E3EAE6; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
      <label for="kommentar" style="font-size: 13px; font-weight: 700; color: #2D7D5A; letter-spacing: 0.6px; text-transform: uppercase">Beskjed til vikaren (valgfritt)</label>
      <textarea id="kommentar" rows="3" style="border: 1px solid #DDE7E1; border-radius: 12px; padding: 12px; font-size: 15px; line-height: 1.4; color: #16271F; resize: none; background: #FBFDFC">5B har prøve i matte. Opplegget ligger på pulten.</textarea>
      <span style="font-size: 13px; color: #56635E; display: flex; gap: 6px; align-items: flex-start; line-height: 1.4">
